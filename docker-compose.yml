name: ${COMPOSE_PROJECT_NAME:-vectus-sat}

x-app-env: &app-env
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    TZ: ${TZ}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    <<: *app-env
    volumes:
      - ./data/outputs:/app/outputs
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    restart: unless-stopped
    command: python -m app.worker
    <<: *app-env
    depends_on:
      db:
        condition: service_healthy

  gotenberg:
    # Conversor DOCX -> PDF (LibreOffice). Solo accesible desde la red interna de Docker.
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command: ["gotenberg", "--api-timeout=120s", "--log-level=warn"]

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-vectus-sat}-web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
